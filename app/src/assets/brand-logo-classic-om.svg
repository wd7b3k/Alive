  <desc id="logoDesc">Classical Om mark with ALIVE wordmark</desc>
  <defs>
    <linearGradient id="omGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cb6c" />
      <stop offset="48%" stop-color="#d8ff74" />
      <stop offset="100%" stop-color="#58dfd1" />
    </linearGradient>
  </defs>
  <rect width="560" height="160" fill="none" />
  <text
    x="18"
    y="114"
