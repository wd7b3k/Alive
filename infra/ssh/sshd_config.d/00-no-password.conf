# Вход по паролю на боевом сервере выключен.
#
# Имя файла начинается с 00 не для красоты. `/etc/ssh/sshd_config` подключает этот
# каталог первой же строкой, файлы читаются в лексическом порядке, и для большинства
# ключей выигрывает ПЕРВОЕ встреченное значение, а не последнее. Порядок здесь такой:
#
#   00-no-password.conf   <- этот файл
#   50-cloud-init.conf    PasswordAuthentication yes   (положил образ провайдера)
#   99-alive.conf         PasswordAuthentication no    (положили при настройке 26.08)
#
# Из-за первого-выигрывает запрет в `99-alive.conf` не действовал ни дня: побеждал
# `yes` из файла провайдера. Настройка выглядела сделанной с 26.08, а `sshd -T` всё
# это время отвечал `passwordauthentication yes` — и к 30.08 в журнале накопилось
# 3692 неудачных попытки входа и 460 забаненных адресов.
#
# Поэтому запрет живёт в файле, который читается раньше файла провайдера. Трогать
# `50-cloud-init.conf` не нужно: он вернётся при следующем обновлении cloud-init.
#
# Проверять действующее значение только так — файл на диске ничего не доказывает:
#   sudo sshd -T | grep -i passwordauthentication
#
# Установка и порядок проверки — infra/ssh/README.md.

PasswordAuthentication no
KbdInteractiveAuthentication no
