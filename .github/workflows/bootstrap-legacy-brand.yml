name: Bootstrap canonical ALIVE brand assets

on:
  push:
    branches:
      - v3.0-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: v3.0-hardening

      - name: Skip when canonical assets already exist
        id: existing
        shell: bash
        run: |
          if [[ -f app/public/brand-logo-icon.png && -f app/public/brand-logo-full.png ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch v2.7 deployment and recover only byte-exact approved PNGs
        if: steps.existing.outputs.skip != 'true'
        env:
          LEGACY_URL: https://script.google.com/macros/s/AKfycbyJ1P7u6VtUAlrvvLyZ8KGHRwoo42FNa7_yZxsfc9-_lozkDaG7mUlBG_Ivb8L1MkPP/exec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/public
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 ALIVE-brand-bootstrap' "$LEGACY_URL" -o /tmp/alive-v27.html
          python3 - <<'PY'
          import base64, hashlib, html as html_lib, pathlib, re, sys

          doc = pathlib.Path('/tmp/alive-v27.html').read_text(encoding='utf-8', errors='replace')
          expected = {
              '95eca2d503e1124f686e39893b793328dcc204a1b393a21dd064350bc8b769da': 'brand-logo-icon.png',
              '11c8624d6ecf84c6a6bb554ca72a7455a0e5c1923ed324fb58c8eeabc42191d2': 'brand-logo-full.png',
          }

          # Apps Script may serialize/escape the original HTML. Search every embedded PNG,
          # decode it, and accept it ONLY when its bytes match an approved SHA exactly.
          variants = [doc, html_lib.unescape(doc)]
          candidates = []
          patterns = [
              r'data:image/png;base64,([A-Za-z0-9+/=\s]+)',
              r'data:image%2Fpng%3Bbase64%2C([A-Za-z0-9%+/=]+)',
          ]
          for variant in variants:
              for pattern in patterns:
                  candidates.extend(re.findall(pattern, variant, re.I))

          found = {}
          seen = set()
          for encoded in candidates:
              encoded = encoded.replace('%2B', '+').replace('%2F', '/').replace('%3D', '=').replace('%0A', '')
              encoded = re.sub(r'\s+', '', encoded)
              if len(encoded) < 100:
                  continue
              try:
                  raw = base64.b64decode(encoded, validate=False)
              except Exception:
                  continue
              digest = hashlib.sha256(raw).hexdigest()
              if digest in seen:
                  continue
              seen.add(digest)
              if digest in expected:
                  filename = expected[digest]
                  pathlib.Path('app/public', filename).write_bytes(raw)
                  found[digest] = filename
                  print(f'FOUND {filename}: {len(raw)} bytes sha256={digest}')

          missing = [filename for digest, filename in expected.items() if digest not in found]
          if missing:
              print(f'Embedded PNG candidates scanned: {len(candidates)}; unique decoded: {len(seen)}')
              print('Exact approved assets not present in public deployment HTML:', ', '.join(missing))
              sys.exit(2)
          PY

      - name: Commit exact approved assets
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/public/brand-logo-icon.png app/public/brand-logo-full.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/brand-logo-icon.png app/public/brand-logo-full.png
          git diff --cached --quiet && exit 0
          git commit -m 'brand: restore exact approved v2.7 Om assets'
          git push origin HEAD:v3.0-hardening
