name: Habitoff frontend CI

on:
  push:
    branches: [main]
  pull_request:
    # The rls-isolation job below exists to validate supabase/migrations, and the
    # bundle scan reads scripts/. Before 2026-08-21 this filter listed only app/**,
    # so a pull request that changed nothing but migrations skipped the entire
    # workflow - including the very job meant to test those migrations. That was not
    # theoretical: PR #13, which rewrote the catalog migrations, ran zero of these
    # checks. Keep this list in step with what the jobs actually read.
    paths:
      - 'app/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, test, build and scan bundle for secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # RISK-V3-002 / VALIDATION.md "browser bundle secret scan PASS" — static check
      # that no service-role/OAuth-secret-shaped string ends up in the shipped bundle.
      # See scripts/scan-bundle-for-secrets.mjs for what it does and doesn't catch.
      - name: Scan production bundle for leaked secrets
        run: node ../scripts/scan-bundle-for-secrets.mjs dist

  current-state:
    name: Изменение кода без обновления CURRENT_STATE.md
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # RELEASE_POLICY §4 и §9 требуют держать docs/CURRENT_STATE.md в актуальном
      # состоянии. Требование верное и до 27.08.2026 ничем не проверялось: документ
      # описывал Cloudflare Pages спустя сутки после переезда на свой сервер.
      #
      # Это предупреждение, а не блокировка. Бывают правки, для которых обновление
      # состояния действительно не нужно, и превращать их в спор с CI дороже, чем
      # изредка получить лишнюю строку в логе. ADR-0009.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when CURRENT_STATE.md is untouched
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          code="$(echo "$changed" | grep -E '^(app|supabase)/' || true)"
          state="$(echo "$changed" | grep -E '^docs/CURRENT_STATE\.md$' || true)"
          if [ -n "$code" ] && [ -z "$state" ]; then
            echo "::warning file=docs/CURRENT_STATE.md::PR меняет app/** или supabase/**, но не трогает docs/CURRENT_STATE.md. RELEASE_POLICY §4/§9 — обновите состояние в этом же PR или объясните в описании, почему не нужно."
          else
            echo "OK: либо код не тронут, либо CURRENT_STATE.md обновлён вместе с ним."
          fi

  rls-isolation:
    name: RLS cross-tenant isolation (local Postgres, no live Supabase credentials)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # RISK-V3-001 / VALIDATION.md "user A -> private rows user B = denied". Runs the
      # real versioned migrations from supabase/migrations/ against a disposable local
      # Postgres — see supabase/tests/local/README.md for exactly what this does and
      # does not prove (it is not a substitute for the live two-Google-account smoke
      # test also required before v3.0 RELEASED).
      - name: Run RLS isolation test
        run: bash supabase/tests/local/run.sh
