name: Habitoff frontend CI

on:
  push:
    branches: [main]
  pull_request:
    # The rls-isolation job below exists to validate supabase/migrations, and the
    # bundle scan reads scripts/. Before 2026-08-21 this filter listed only app/**,
    # so a pull request that changed nothing but migrations skipped the entire
    # workflow - including the very job meant to test those migrations. That was not
    # theoretical: PR #13, which rewrote the catalog migrations, ran zero of these
    # checks. Keep this list in step with what the jobs actually read.
    paths:
      - 'app/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/**'
      - 'docs/board/**'
      # Джобы postanovka и predely читают постановки, записи сессий и живые документы:
      # без этих путей PR, который заводит постановку с занятым номером или ломает
      # число в документе, пропустил бы обе проверки целиком — ровно так, как до
      # 21.08.2026 PR с одними миграциями пропускал rls-isolation.
      - 'docs/tasks/**'
      - 'docs/ai_sessions/**'
      - 'docs/*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, test, build and scan bundle for secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      # Полная история нужна сборке: scripts/build-changelog.mjs разбирает git log
      # в раздел «Что сделано». С глубиной 1 он собрал бы список из одного коммита и
      # молча — ADR-0018.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # RISK-V3-002 / VALIDATION.md "browser bundle secret scan PASS" — static check
      # that no service-role/OAuth-secret-shaped string ends up in the shipped bundle.
      # See scripts/scan-bundle-for-secrets.mjs for what it does and doesn't catch.
      - name: Scan production bundle for leaked secrets
        run: node ../scripts/scan-bundle-for-secrets.mjs dist

  current-state:
    name: Изменение кода без обновления CURRENT_STATE.md
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # RELEASE_POLICY §4 и §9 требуют держать docs/CURRENT_STATE.md в актуальном
      # состоянии. Требование верное и до 27.08.2026 ничем не проверялось: документ
      # описывал Cloudflare Pages спустя сутки после переезда на свой сервер.
      #
      # Это предупреждение, а не блокировка. Бывают правки, для которых обновление
      # состояния действительно не нужно, и превращать их в спор с CI дороже, чем
      # изредка получить лишнюю строку в логе. ADR-0009.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when CURRENT_STATE.md is untouched
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          code="$(echo "$changed" | grep -E '^(app|supabase)/' || true)"
          state="$(echo "$changed" | grep -E '^docs/CURRENT_STATE\.md$' || true)"
          if [ -n "$code" ] && [ -z "$state" ]; then
            echo "::warning file=docs/CURRENT_STATE.md::PR меняет app/** или supabase/**, но не трогает docs/CURRENT_STATE.md. RELEASE_POLICY §4/§9 — обновите состояние в этом же PR или объясните в описании, почему не нужно."
          else
            echo "OK: либо код не тронут, либо CURRENT_STATE.md обновлён вместе с ним."
          fi

  board:
    name: Доска работ знает о том, что сделано
    runs-on: ubuntu-latest
    steps:
      # ADR-0012: состояние работ — данные репозитория, двигает карточку коммит
      # строкой `Board: done <id>`. Проверка падает, если трейлеры написаны, а
      # docs/board/cards.json их не знает (значит, забыт `board.mjs apply`), и
      # предупреждает, если коммит трогал app/ или supabase/ вообще без трейлера
      # — работа сделана, а доска о ней не узнает.
      #
      # Полная история нужна: скрипт читает диапазон от appliedCommit до HEAD.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # Зависимостей у скрипта нет намеренно — npm ci здесь не нужен.
      - name: Проверить карточки и трейлеры
        run: node scripts/board.mjs check

      - name: Собрать страницу доски
        run: node scripts/board.mjs build

  postanovka:
    name: Постановка знает свой номер и свою тему
    runs-on: ubuntu-latest
    steps:
      # За один день 05.09.2026 номера разъехались пять раз: три постановки и две записи
      # сессии означали по две разные работы каждая. Номер выдаёт scripts/next-id.sh,
      # а этот джоб не даёт коллизии дожить до main. Заодно проверяется тема в имени
      # файла: тема, которой нет среди эпиков доски, означает работу, которую доска
      # не увидит.
      #
      # Числа в живых документах проверяются здесь же: `CLAUDE.md` полгода утверждал
      # «150 карточек» при 214, и заметил это только разбор.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Номера постановок и записей сессий уникальны, темы есть на доске
        run: node scripts/check-tasks.mjs

      - name: Числа в живых документах совпадают с репозиторием
        run: node scripts/check-numbers.mjs

  predely:
    name: Пределы одновременной работы
    runs-on: ubuntu-latest
    steps:
      # Пределы записаны в AGENTS.md с 27.08.2026 и до 06.09 не соблюдались ни дня:
      # восемь doing при пределе два, 44 карточки с приоритетом 0 при пределе три,
      # четырнадцать неисполненных постановок при пределе одна. Джоб включён жёстким
      # после того, как состояние разобрано решением владельца: эпик i18n подвешен,
      # у выполненных задач заполнен «Результат», карточки doing без коммита за три дня
      # переставлены в next, приоритет 0 оставлен двум карточкам.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Не больше двух doing, трёх P0 и одной постановки в очереди
        run: node scripts/check-limits.mjs

  rls-isolation:
    name: RLS cross-tenant isolation (local Postgres, no live Supabase credentials)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # RISK-V3-001 / VALIDATION.md "user A -> private rows user B = denied". Runs the
      # real versioned migrations from supabase/migrations/ against a disposable local
      # Postgres — see supabase/tests/local/README.md for exactly what this does and
      # does not prove (it is not a substitute for the live two-Google-account smoke
      # test also required before v3.0 RELEASED).
      - name: Run RLS isolation test
        run: bash supabase/tests/local/run.sh
