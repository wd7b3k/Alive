name: ALIVE frontend CI

on:
  push:
    branches:
      - main
      - v3.0-hardening
  pull_request:
    paths:
      - 'app/**'
      - 'docs/BRANDBOOK.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: UI contract, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Inspect ALIVE brand asset
        run: |
          identify src/assets/brand-logo-full.png
          convert src/assets/brand-logo-full.png -alpha extract -trim -format 'VISIBLE_BOUNDS=%@\n' info:

      - name: Enforce ALIVE UI contract
        run: node scripts/check-ui-contract.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
